<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位繪本</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #2c2c2c;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .book-container {
            position: relative;
            width: 90%;
            max-width: 800px;
            background-color: #1a1a1a;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            max-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #4CAF50;
            color: white;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #45a049;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 18px;
            font-weight: bold;
            min-width: 80px;
            text-align: center;
        }

        .audio-controls {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .speech-btn {
            background-color: #ff9800;
        }

        .speech-btn:hover {
            background-color: #f57c00;
        }

        .toggle-btn {
            background-color: #2196F3;
        }

        .toggle-btn.off {
            background-color: #757575;
        }
    </style>
</head>
<body>

<div class="book-container">
    <!-- 繪本圖片區域 -->
    <div class="image-wrapper">
        <img id="book-img" src="" alt="繪本頁面">
    </div>

    <!-- 頁碼與換頁按鈕 -->
    <div class="controls">
        <button id="prev-btn" onclick="changePage(-1)">上一頁</button>
        <span class="page-info" id="page-number">0 / 19</span>
        <button id="next-btn" onclick="changePage(1)">下一頁</button>
    </div>

    <!-- 音效與語音控制區 -->
    <div class="audio-controls">
        <button id="speech-btn" class="speech-btn" onclick="playSpeech()">🔊 朗讀本頁</button>
        <button id="music-btn" class="toggle-btn" onclick="toggleMusic()">背景音樂：開啟</button>
    </div>
</div>

<!-- 聲音播放元件 -->
<audio id="speech-player"></audio>
<audio id="music-player"></audio>

<script>
    const totalPages = 20;
    let currentPage = 0;
    let isMusicEnabled = true;

    // 單層 assets 資料夾路徑
    const basePath = 'assets';

    const imgElement = document.getElementById('book-img');
    const pageNumberElement = document.getElementById('page-number');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    const speechPlayer = document.getElementById('speech-player');
    const musicPlayer = document.getElementById('music-player');

    // 載入指定頁面
    function loadPage(page) {
        if (page < 0 || page >= totalPages) return;
        currentPage = page;

        // 1. 更新圖片
        imgElement.src = `${basePath}/graphics/${currentPage}.jpg`;

        // 2. 更新頁碼
        pageNumberElement.innerText = `${currentPage} / ${totalPages - 1}`;

        // 3. 按鈕狀態
        prevBtn.disabled = (currentPage === 0);
        nextBtn.disabled = (currentPage === totalPages - 1);

        // 4. 切換頁面時停止上一頁朗讀
        speechPlayer.pause();
        speechPlayer.currentTime = 0;

        // 5. 換頁自動播放背景音樂 mp3
        if (isMusicEnabled) {
            musicPlayer.src = `${basePath}/music/music${currentPage}.mp3`;
            musicPlayer.play().catch(e => {
                console.log("瀏覽器限制自動播放，請點擊頁面任意處後播放：", e);
            });
        }
    }

    // 點擊按鈕手動朗讀本頁 mp3
    function playSpeech() {
        speechPlayer.src = `${basePath}/speech/speech${currentPage}.mp3`;
        speechPlayer.play().catch(e => {
            console.log("語音播放失敗：", e);
        });
    }

    // 切換音樂自動播放狀態
    function toggleMusic() {
        isMusicEnabled = !isMusicEnabled;
        const btn = document.getElementById('music-btn');
        if (isMusicEnabled) {
            btn.innerText = "背景音樂：開啟";
            btn.classList.remove('off');
            musicPlayer.src = `${basePath}/music/music${currentPage}.mp3`;
            musicPlayer.play().catch(e => {});
        } else {
            btn.innerText = "背景音樂：關閉";
            btn.classList.add('off');
            musicPlayer.pause();
        }
    }

    // 換頁功能
    function changePage(direction) {
        const newPage = currentPage + direction;
        if (newPage >= 0 && newPage < totalPages) {
            loadPage(newPage);
        }
    }

    // 初始化載入第 0 頁
    window.onload = () => {
        loadPage(0);
    };
</script>

</body>
</html>
